name: QA Unidade 3 - ViaCEP

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar estrutura e regras locais
        run: python -m pytest -v -m "not integration"

      - name: Executar integração real com ViaCEP
        run: python -m pytest -v -m integration --junitxml=reports/junit.xml

      - name: Publicar relatório JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-unidade3-junit
          path: reports/junit.xml
          if-no-files-found: warn
